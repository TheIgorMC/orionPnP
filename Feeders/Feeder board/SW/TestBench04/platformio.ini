; PlatformIO Project Configuration File
;
; ATmega328PB-AU + DRV8833 + AS5600 closed-loop wheel position test bench
;
; Board runs on its internal 8MHz RC oscillator (no crystal populated) and
; is flashed via ISP (no bootloader). See project.md before your first
; flash - it covers fuse bytes / oscillator selection and why 9600 baud was
; chosen over the 115200 used on the STM32 test benches.

[platformio]
default_envs = atmega328pb_isp

[env:atmega328pb_isp]
platform = atmelavr
board = ATmega328PB
framework = arduino

; Internal 8MHz RC oscillator - no crystal on this board.
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal
board_hardware.uart = uart0
board_hardware.bod = 2v7
board_hardware.eesave = yes

; USBasp programmer via ISP (6-pin header into the AVR's SPI/reset pins).
; No bootloader involved: `pio run -t upload` writes flash directly.
; Swap upload_protocol below if you're using a different programmer:
;   upload_protocol = stk500v1      ; classic Arduino-as-ISP
;   upload_protocol = avrispmkii    ; Atmel/Microchip AVRISP mkII
upload_protocol = usbasp

monitor_speed = 9600
