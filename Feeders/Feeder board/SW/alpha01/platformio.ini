; PlatformIO Project Configuration File
;
; alpha01 - ATmega328PB-AU feeder firmware for the real Feeder board V0.2a/b:
; DRV8833 + AS5600 closed-loop wheel position, plus RS485 transport on
; USART0 with RE/DE direction control, debug port on USART1. See project.md.
;
; Board runs on its internal 8MHz RC oscillator (no crystal populated) and
; is flashed via ISP (no bootloader) - same as TestBench04.

[platformio]
default_envs = atmega328pb_isp

[env:atmega328pb_isp]
platform = atmelavr
board = ATmega328PB
framework = arduino

; Internal 8MHz RC oscillator - no crystal on this board.
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal
board_hardware.uart = uart0
board_hardware.bod = 2v7
board_hardware.eesave = yes

; USBasp programmer via ISP (6-pin header into the AVR's SPI/reset pins,
; the same physical header USART1/Serial1 debug output is wired through -
; see pins_config.h). No bootloader involved: `pio run -t upload` writes
; flash directly. Swap upload_protocol below if using a different
; programmer:
;   upload_protocol = stk500v1      ; classic Arduino-as-ISP
;   upload_protocol = avrispmkii    ; Atmel/Microchip AVRISP mkII
upload_protocol = usbasp

monitor_speed = 9600
