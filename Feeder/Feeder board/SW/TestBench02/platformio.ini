; PlatformIO Project Configuration File
;
; STM32F411CC Blackpill + DRV8833 test bench

[platformio]
default_envs = blackpill_f411cc_dfu

[env:blackpill_f411cc_dfu]
platform = ststm32
board = genericSTM32F411CC
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; Fallback for environments where genericSTM32F411CC is unavailable
[env:blackpill_f411ce_dfu]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
monitor_speed = 115200
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
