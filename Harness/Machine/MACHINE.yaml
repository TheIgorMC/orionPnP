cables:
  W_CAM_HEAD: &RSVP
    wirecount: 4
    length: 2.60
    gauge: 24 AWG
    colors: [RD, YE, GN, BK]
    shield: true
    notes: Cable from head camera to Core

  W_CAM_BOT:
    <<: *RSVP
    length: 0.15
    shield: true
    notes: Cable from bottom camera to Core

  W_FEEDERS:
    <<: *RSVP
    length: 0.75
    shield: true
    notes: Cable from feeders to Core

  W_HEAD_R: &SUPERTRONIC
    wirecount: 4
    length: 2.60
    gauge: 22 AWG
    color_code: DIN
    notes: SUPERTRONIC PVC 4x0.34mm²

  W_HEAD_L:
    <<: *SUPERTRONIC
    length: 2.60

  W_Z:
    <<: *SUPERTRONIC

  W_LED:
    <<: *SUPERTRONIC

  W_LEDBOT:
    <<: *SUPERTRONIC
    length: 0.11

  W_X:
    <<: *SUPERTRONIC
    length: 1.85

  W_Y1:
    <<: *SUPERTRONIC
    length: 0.85

  W_Y2:
    <<: *SUPERTRONIC
    length: 0.45

  W_FEEDERS_PWR:
    <<: *SUPERTRONIC
    length: 0.75
    notes: Power cable from feeders to Core

  W_MAINS:
    wirecount: 3
    length: 0.28
    gauge: 18 AWG
    colors: [BU, BN, GNYE]

  W_PE:
    wirecount: 1
    length: 0.10
    gauge: 18 AWG
    colors: [GNYE]

  W_PWRIN:
    wirecount: 2
    length: 0.20
    gauge: 18 AWG
    colors: [RD, BK]
    notes: Power input to board

  W_SOL_VAC:
    <<: *SUPERTRONIC
    length: 0.38
    notes: Vacuum sol. 1/2
    
  W_SOL_BLO:
    <<: *SUPERTRONIC
    length: 0.25
    notes: Blowoff sol. 1/2

  W_PUMP:
    <<: *SUPERTRONIC
    length: 0.15
    notes: Pump cable

connections:

