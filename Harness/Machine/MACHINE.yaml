cables:
  W_CAM_HEAD: &RSVP
    wirecount: 4
    length: 2.60
    gauge: 24 AWG
    colors: [RD, YE, GN, BK]
    shield: true
    notes: Cable from head camera to Core

  W_CAM_BOT:
    <<: *RSVP
    length: 0.15
    shield: true
    notes: Cable from bottom camera to Core

  W_HEAD_R: &SUPERTRONIC
    wirecount: 4
    length: 2.60
    gauge: 22 AWG
    color_code: DIN

  W_HEAD_L:
    <<: *SUPERTRONIC
    length: 2.60

  W_Z:
    <<: *SUPERTRONIC

  W_LED:
    <<: *SUPERTRONIC

  W_X:
    <<: *SUPERTRONIC
    length: 1.85

  W_Y1:
    <<: *SUPERTRONIC
    length: 0.85

  W_Y2:
    <<: *SUPERTRONIC
    length: 0.45

  W_MAINS:
    wirecount: 3
    length: 0.28
    gauge: 18 AWG
    colors: [BL, BR, GNYE]

  W_PE:
    wirecount: 1
    length: 0.10
    gauge: 18 AWG
    color: GNYE

connections:

  -
    - IEC_N: [1]
    - W_MAINS: [1]
    - PSU_N: [1]

  -
    - IEC_P: [1]
    - W_MAINS: [2]
    - PSU_P: [1]

  - 
    - IEC_PE: [1]
    - W_MAINS: [3]
    - PSU_PE: [1]

  -
    - IEC_PE: [1]
    - W_PE: [1]
    - FRAME_PE: [1]

  -
    - LED_HEAD: [1, 2]
    - W_LED: [1, 2]
    - LED_CON: [1, 2]

  -
    - END_HEAD: [1, 2]
    - W_LED: [3, 4]
    - END_CON: [1, 2]

  -
    - USB_HEAD: [1-4]
    - W_CAM_HEAD: [1-4]
    - USB_CON: [1-4]

  -
    - W_CAM_HEAD: s
    - USB_CON: 4

  -
    - MOTOR_L_HEAD: [1-4]
    - W_HEAD_L: [1-4]
    - MOTOR_L_CON: [1-4]

  -
    - MOTOR_R_HEAD: [1-4]
    - W_HEAD_R: [1-4]
    - MOTOR_R_CON: [1-4]

  - 
    - MOTOR_Z_HEAD: [1-4]
    - W_Z: [1-4]
    - MOTOR_Z_CON: [1-4]

  -
    - MOTOR_X_PLUG: [1-4]
    - W_X: [1-4]
    - MOTOR_X_CON: [1-4]

  -
    - MOTOR_Y1_PLUG: [1-4]
    - W_Y1: [1-4]
